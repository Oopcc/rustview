[package]
name = "rustview"
version = "0.1.0"
edition = "2021"
description = "Lightweight cross-platform image viewer (GIF, WebP, PNG, JPEG, ...)"
license = "MIT"
readme = "README.md"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = [
    "gif", "jpeg", "png", "webp", "bmp", "ico", "tiff", "tga", "pnm", "qoi",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
